<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="#1775fc"/>
  <!-- road -->
  <rect x="6" y="47" width="52" height="3" rx="1.5" fill="#ffffff" opacity="0.3"/>
  <!-- RV silhouette: tall box body + sloped windshield + hood -->
  <path d="M10 40 V21 H36 L48 30 H52 V40 Z" fill="#ffffff"/>
  <!-- windshield + windows (cut out in body color) -->
  <g fill="#1775fc">
    <path d="M38.5 24 L45.5 29.5 H38.5 Z"/>
    <rect x="14" y="25" width="8" height="7" rx="1.5"/>
    <rect x="25" y="25" width="8" height="7" rx="1.5"/>
  </g>
  <!-- wheels -->
  <g>
    <circle cx="20" cy="41" r="5.5" fill="#0d2b57"/>
    <circle cx="20" cy="41" r="2.2" fill="#ffffff"/>
    <circle cx="45" cy="41" r="5.5" fill="#0d2b57"/>
    <circle cx="45" cy="41" r="2.2" fill="#ffffff"/>
  </g>
</svg>
